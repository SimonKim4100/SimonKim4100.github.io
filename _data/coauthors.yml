# Co-author links in the publication author lists (_layouts/bib.liquid in al_folio_core).
# Key: the co-author's last name as written in _bibliography/papers.bib, lower-cased,
# accents removed (hyphens kept). firstname: every first-name form used for that person
# in papers.bib. An author whose last name AND first name match gets a link to `url`.
# Example (uncomment and fill in to use):
#
# "lastname":
#   - firstname: ["Firstname"]
#     url: https://example.com/
